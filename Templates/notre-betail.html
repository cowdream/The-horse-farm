<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notre bétail | The Horse Farm</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Georgia, serif;
            color: #33291f;
            background: #f4efe6;
        }

        .hero {
            background: #4a2418;
            color: white;
            text-align: center;
            padding: 45px 20px;
        }

        .hero h1 {
            margin: 0;
            font-size: 2.5rem;
        }

        .hero p {
            margin: 12px 0 0;
            font-style: italic;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 35px 20px;
        }

        .intro {
            text-align: center;
            margin-bottom: 30px;
        }

        .photos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .photos img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 14px;
            border: 2px solid #7a481f;
        }

        .retour {
            text-align: center;
            margin: 40px 0 20px;
        }

        .retour a {
            display: inline-block;
            background: #7a481f;
            color: white;
            padding: 12px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .photos {
                grid-template-columns: 1fr;
            }

            .photos img {
                height: auto;
            }
        }
    </style>
</head>

<body>

    <header class="hero">
        <h1>Notre bétail</h1>
        <p>L'esprit ranch au cœur de The Horse Farm</p>
    </header>

    <main class="container">

        <div class="intro">
            <h2>Le bétail de The Horse Farm</h2>
            <p>
                Découvrez notre bétail et l'univers western de The Horse Farm,
                où chevaux et bétail font partie intégrante de la vie du ranch.
            </p>
        </div>

        <div class="photos">
            <img src="/static/file_000000001a38820ab6599ea47cdcefc0.jpg" alt="Bétail The Horse Farm">
            <img src="/static/file_000000009f84820a92df6d41d7004fcf.jpg" alt="Vache The Horse Farm">
            <img src="/static/file_000000000724821090e11bf9fbe804b3.jpg" alt="Bétail au ranch">
            <img src="/static/file_00000000452881f4ba84cf804537812d.jpg" alt="Travail du bétail à cheval">
        </div>

        <div class="retour">
            <a href="/pension-chevaux">← Retour à notre pension</a>
        </div>

    </main>

</body>
</html>
