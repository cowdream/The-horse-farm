
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - The Horse Farm</title>

    <style>
        body {
            margin: 0;
            font-family: Georgia, serif;
            background: #f5f0e6;
            color: #29251f;
        }

        header {
            background: #24382c;
            color: white;
            text-align: center;
            padding: 25px;
            border-bottom: 4px solid #8b5e3c;
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
        }

        header p {
            margin: 6px 0 0;
            letter-spacing: 2px;
            font-size: 0.8rem;
        }

        .container {
            max-width: 450px;
            margin: 70px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            color: #24382c;
            margin-top: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #8b5e3c;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .message {
            color: #a33;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>THE HORSE FARM</h1>
    <p>PORT DE BOUC</p>
</header>

<div class="container">
    <div class="box">

        <h2>Espace administrateur</h2>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <label for="password">Mot de passe</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Votre mot de passe"
                required
            >

            <button type="submit">
                Se connecter
            </button>

        </form>

    </div>
</div>

</body>
</html>
