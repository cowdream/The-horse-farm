
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Horse Farm - Balades à cheval</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Georgia,serif;
    background:#f5f0e6;
    color:#33291f;
    line-height:1.6;
}

header{
    background:#30271f;
    color:white;
    padding:18px 20px;
    position:sticky;
    top:0;
    z-index:10;
    border-bottom:3px solid #b8844f;
}

.nav{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.logo{
    font-size:25px;
    font-weight:bold;
    letter-spacing:2px;
}

.logo small{
    display:block;
    font-size:11px;
    color:#d9b47b;
    letter-spacing:3px;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
}

nav a:hover{color:#d9b47b}

.hero{
    min-height:620px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:50px 20px;
    color:white;
    background:
    linear-gradient(rgba(35,28,21,.45),rgba(35,28,21,.75)),
    linear-gradient(135deg,#71865a,#3d5134 55%,#30271f);
}

.hero-content{max-width:800px}

.hero small{
    color:#e3bd7e;
    text-transform:uppercase;
    letter-spacing:4px;
}

.hero h1{
    font-size:clamp(48px,10vw,90px);
    text-transform:uppercase;
    letter-spacing:4px;
    line-height:1;
    margin:20px 0;
}

.hero h2{
    font-size:clamp(22px,5vw,34px);
    font-weight:normal;
    margin-bottom:15px;
}

.hero p{
    font-size:18px;
    max-width:650px;
    margin:0 auto 30px;
}

.button{
    display:inline-block;
    background:#a96836;
    color:white;
    border:0;
    border-radius:6px;
    padding:14px 25px;
    text-decoration:none;
    font-weight:bold;
    cursor:pointer;
}

.button:hover{background:#7f4d29}

section{padding:70px 20px}

.container{
    max-width:1100px;
    margin:auto;
}

.title{
    text-align:center;
    margin-bottom:40px;
}

.title small{
    color:#9b6737;
    text-transform:uppercase;
    letter-spacing:3px;
}

.title h2{
    font-size:40px;
    margin-top:5px;
}

.title p{
    max-width:650px;
    margin:10px auto;
    color:#6b5d4e;
}

#balades{background:#fffdf8}

.cards{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:25px;
}

.card{
    background:white;
    border:1px solid #dfd1bd;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(50,40,30,.1);
}

.card-top{
    background:#435637;
    color:white;
    text-align:center;
    padding:25px;
}

.card-top h3{font-size:28px}

.price{
    color:#e2bd7c;
    font-size:40px;
    font-weight:bold;
}

.card-body{padding:25px}

.card-body ul{
    list-style:none;
    margin-bottom:20px;
}

.card-body li{
    padding:7px 0;
    border-bottom:1px solid #eee5d8;
}

.card-body li:before{
    content:"✓ ";
    color:#718b55;
    font-weight:bold;
}

#esprit{background:#e7dfd0}

.about{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:45px;
    align-items:center;
}

.about h2{font-size:40px;margin-bottom:15px}

.about p{margin-bottom:15px;color:#5e5144}

.values{
    display:grid;
    gap:15px;
}

.value{
    background:#fffaf1;
    padding:20px;
    border-left:5px solid #a96836;
}

.value strong{
    display:block;
    font-size:18px;
}

#reservation{background:#fffdf8}

.booking{
    max-width:850px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 8px 30px rgba(50,40,30,.1);
    border:1px solid #ded1bd;
}

.booking h3{
    text-align:center;
    font-size:30px;
    margin-bottom:10px;
}

.booking-intro{
    text-align:center;
    color:#6b5d4e;
    margin-bottom:25px;
}

.form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.field{display:flex;flex-direction:column}

.full{grid-column:1/-1}

label{
    font-family:Arial,sans-serif;
    font-weight:bold;
    font-size:14px;
    margin-bottom:6px;
}

input,select,textarea{
    width:100%;
    padding:13px;
    border:1px solid #cdbda7;
    border-radius:5px;
    font-size:16px;
    background:#fffdf9;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.summary{
    margin-top:25px;
    padding:18px;
    background:#f1e8d9;
    border-left:5px solid #a96836;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:5px 0;
}

.total{
    border-top:1px solid #d5c6
